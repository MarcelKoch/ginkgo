name: Spell Check

on:
  workflow_call:

jobs:
  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, '1:ST:SKIP_ALL_CI') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for typos
        uses: crate-ci/typos@master
        with:
          config: .github/_typos.toml
