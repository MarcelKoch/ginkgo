name: CI

on:
  workflow_call:
    inputs:
      from_push:
        description: 'Workflow was triggered by push event'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled by `debug_enabled` keyword (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

concurrency:
  # runs for labels that don't start the full test get their own group,
  # so that they don't cancel running builds
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  arm:
    if: &run >-
      ${{ inputs.from_push || !contains(github.event.pull_request.labels.*.name, '1:ST:SKIP_ALL_CI') }}
    uses: ./.github/workflows/ci.arm.yml
    with: &with
      full: false

  osx:
    if: *run
    uses: ./.github/workflows/ci.osx.yml
    with: *with

  windows-msvc:
    if: *run
    uses: ./.github/workflows/ci.windows-msvc.yml
    with: *with

  linux-gcc:
    if: *run
    uses: ./.github/workflows/ci.linux-gcc.yml
