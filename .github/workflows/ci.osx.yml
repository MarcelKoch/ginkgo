name: OSX-build

on:
  workflow_call:
    inputs:
      full:
        description: 'Run all configurations instead of the reduced pull request set'
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled by `debug_enabled` keyword (https://github.com/marketplace/actions/debugging-with-tmate)'
        type: boolean
        required: false
        default: false
      full:
        description: 'Run all configurations instead of the reduced pull request set'
        type: boolean
        required: false
        default: true

jobs:
  define-matrix:
    runs-on: ubuntu-slim
    outputs:
      config: ${{ steps.config.outputs.config }}

    steps:
      - name: Define Config
        id: config
        run: |
          echo '[{"shared": "OFF", "build_type": "Release", "name": "omp/release/static", "mixed": "ON", "half": "ON", "bfloat16": "OFF"}]' >> config.json
          if [[ "${{ inputs.full }}" == "true" ]]; then
            echo '[{"shared": "ON", "build_type": "Debug", "name": "omp/debug/shared", "mixed": "OFF", "half": "ON", "bfloat16": "OFF"}]' >> config.json
            echo '[{"shared": "ON", "build_type": "Release", "name": "omp/release/shared", "mixed": "ON", "half": "OFF", "bfloat16": "OFF"}]' >> config.json
            echo '[{"shared": "ON", "build_type": "Release", "name": "omp/release/shared-16bit", "mixed": "ON", "half": "ON", "bfloat16": "OFF"}]' >> config.json
          fi
          echo $(cat config.json)
          echo $(jq -s add config.json)
          echo "config=$(jq -s add config.json)" >> $GITHUB_OUTPUT
          echo "$GITHUB_OUTPUT"

  dummy:
    needs: define-matrix
    runs-on: ubuntu-slim
    steps:
      - name: Dummy
        run: echo "${{ needs.define-matrix.outputs.config }}"

  osx-clang-omp:
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.define-matrix.outputs.config) }}
    name: ${{ matrix.config.name }}
    runs-on: [macos-latest]
    timeout-minutes: 240
    env: &env
      # compiled objects are cached between runs, see the ccache steps
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M

    steps: &steps
      - name: Dummy
        run: echo "${{ matrix.config.name }}"
