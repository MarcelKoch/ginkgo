name: Linux-GCC

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled by `debug_enabled` keyword (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        type: boolean
        default: false

jobs:
  omp-mpi:
    strategy:
      fail-fast: false
      matrix:
        config:
          - {shared: "ON", build_type: "Release", name: "omp/openmpi/release/shared"}
    name: ${{ matrix.config.name }}
    runs-on: [ubuntu-24.04]
    timeout-minutes: 300
    env:
      # compiled objects are cached between runs, see the ccache steps
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      # the runner has 4 cores, but some MPI tests use up to 8 processes
      OMPI_MCA_rmaps_base_oversubscribe: 1
      EXEC: omp

    steps:
      - name: Dummy
        run: echo "${{ fromJSON(matrix.config) }}"
