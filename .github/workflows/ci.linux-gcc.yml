  cuda:
    strategy:
      fail-fast: false
      matrix:
        config:
          - {version: "13.3.1", name: "cuda-13.3/release/shared", arch: "80"}
    name: ${{ matrix.config.name }} (only compile)
    runs-on: [ubuntu-24.04]
    # GitHub cancels jobs after 6 hours; stop earlier so that ccache is saved
    timeout-minutes: 330
    env:
      # compiled objects are cached between runs, see the ccache steps
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      IMAGE: nvidia/cuda:${{ matrix.config.version }}-devel-ubuntu24.04
