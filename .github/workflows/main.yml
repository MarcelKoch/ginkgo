name: Workflow

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'develop'
      - 'release/**'
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - 'doc/**'

concurrency:
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror
    uses: ./.github/workflows/mirror.yml

  quality-of-life-group:
    name: Quality of Life Group
    runs-on: ubuntu-slim

  quality-of-life:
    name: Quality of Life
    if: ${{ always() && (github.event_name == 'pull_request') }}
    needs: [mirror, quality-of-life-group]
    uses: ./.github/workflows/qol.yml

  ci-group:
    name: CI Group
    runs-on: ubuntu-slim

  ci:
    name: CI
    if: ${{ always() }}
    needs: [mirror, ci-group]
    uses: ./.github/workflows/ci.yml
    with:
      from_push: ${{ github.event_name == 'push' }}
